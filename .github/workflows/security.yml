name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Cargo.lock against RustSec
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          mkdir cargo-audit
          cd cargo-audit
          curl --fail --silent --show-error --location \
            'https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz' \
            --output cargo-audit.tgz
          echo 'ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39  cargo-audit.tgz' | sha256sum --check
          tar -xzf cargo-audit.tgz
          auditor=$(find . -type f -name cargo-audit -print -quit)
          "$auditor" audit --file "$GITHUB_WORKSPACE/Cargo.lock"

  source:
    name: Rust static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Scan Rust code with Semgrep
        shell: bash
        run: |
          rules="$RUNNER_TEMP/semgrep-rust.yml"
          curl --fail --silent --show-error --location https://semgrep.dev/c/p/rust --output "$rules"
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --volume "$rules:/rules.yml:ro" \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/src \
            semgrep/semgrep:1.185.0 \
            semgrep scan --config /rules.yml --metrics=off --disable-version-check /src

  secrets:
    name: Scan Git history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan with Gitleaks
        shell: bash
        run: |
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact=100 --log-opts="--all --full-history" /repo
