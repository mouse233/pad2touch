[package]
name = "padbridge-phase0"
version = "0.4.0"
edition = "2021"
description = "Native GUI for Precision Touchpad capture and synchronized native touch injection"
license = "MIT"
repository = "https://github.com/mouse233/padbridge"

[dependencies]
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
windows-sys = { version = "=0.61.2", features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security",
    "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Registry",
    "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Console",
    "Win32_UI_Input", "Win32_UI_Input_Pointer", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls"
] }

[profile.release]
debug = 1
